# hyprlock config (gruvbox, like swaylock -c 282828)
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

general {
    hide_cursor = true
}

background {
    monitor =
    color = rgb(282828)
}

input-field {
    monitor =
    size = 600, 100
    outline_thickness = 3
    outer_color = rgb(d65d0e)
    inner_color = rgb(3c3836)
    font_color = rgb(ebdbb2)
    check_color = rgb(d79921)
    fail_color = rgb(cc241d)
    placeholder_text =
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgb(ebdbb2)
    font_size = 96
    font_family = EAW CONSOLE
    position = 0, 80
    halign = center
    valign = center
}
